<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 118 36">
  <!-- Two overlapping circles (Körber mark concept) -->
  <circle cx="13" cy="18" r="11.5" fill="none" stroke="#1A1A1A" stroke-width="2.5"/>
  <circle cx="23" cy="18" r="11.5" fill="none" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- K letterform in intersection -->
  <text x="18" y="23" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#1A1A1A" text-anchor="middle">K</text>
  <!-- KÖRBER wordmark -->
  <text x="42" y="23" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="800" fill="#1A1A1A" letter-spacing="1">KÖRBER</text>
</svg>
